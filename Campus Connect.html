<style>
/* Layout: sticky indigo navbar, indigo hero with attendance preview card, light content sections; app views use a tab bar + card grid. Palette and fonts come from the project's own style.css. */
:root{
  --indigo:#1f2a5c; --indigo-dark:#151d44; --amber:#f5b83d; --amber-hi:#ffc95c; --on-amber:#151d44;
  --paper:#f5f6fb; --card:#ffffff; --ink:#232842; --muted:#5b6180; --line:#dfe2ef;
  --green:#1e9e6a; --red:#c9373f; --soft:#eceefa; --hero:#1f2a5c;
  --font-head:"Bricolage Grotesque","Segoe UI",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1430; --card:#182049; --ink:#e8eaf6; --muted:#a4aacb; --line:#2b3566; --soft:#202a5a;
  --green:#3ccf94; --red:#ff7b83; --hero:#151d44; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1430; --card:#182049; --ink:#e8eaf6; --muted:#a4aacb; --line:#2b3566; --soft:#202a5a;
  --green:#3ccf94; --red:#ff7b83; --hero:#151d44; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1.05rem;line-height:1.6}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0 0 .5rem;text-wrap:balance}
p{margin:0 0 1rem;max-width:62ch}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.container{width:min(1100px,100% - 2rem);margin-inline:auto}

/* navbar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--indigo-dark);color:#fff}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:64px;flex-wrap:wrap}
.logo{font-family:var(--font-head);font-weight:800;font-size:1.4rem;color:#fff;background:none;border:0;cursor:pointer;padding:0}
.logo span{color:var(--amber)}
.logo{display:inline-flex;align-items:center;gap:.65rem}
.logo-badge{display:inline-flex}
.logo-badge img{height:38px;width:auto;display:block}
.hero-logo{display:block;width:min(230px,70%);height:auto;margin:0 0 1.5rem}
.login-logo{display:block;width:min(190px,60%);height:auto;margin:0 0 1.2rem}
.login-logo.on-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login-logo.on-light{display:none}:root:not([data-theme="light"]) .login-logo.on-dark{display:block}}
:root[data-theme="dark"] .login-logo.on-light{display:none}:root[data-theme="dark"] .login-logo.on-dark{display:block}
@media (max-width:480px){.logo{font-size:1.15rem}.logo-badge img{height:30px}}
.nav-links{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.nav-links a,.nav-links button.lnk{color:#fff;background:none;border:0;cursor:pointer;font-weight:600;opacity:.9;text-decoration:none;padding:.25rem 0}
.nav-links a:hover,.nav-links button.lnk:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
.nav-login{background:var(--amber)!important;color:var(--on-amber)!important;padding:.4rem 1.1rem!important;border-radius:999px;opacity:1!important}
.who{font-size:.95rem;opacity:.85}
.theme-btn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:.25rem .8rem;cursor:pointer;font-size:.9rem}

/* buttons */
.btn{display:inline-block;font-weight:700;padding:.8rem 1.6rem;border-radius:999px;border:2px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--amber);color:var(--on-amber)}
.btn-primary:hover{background:var(--amber-hi)}
.btn-outline{border-color:#fff;color:#fff;background:none}
.btn-outline:hover{background:#fff;color:var(--indigo)}
.btn-small{padding:.4rem 1rem;font-size:.92rem}
.btn-ghost{border-color:var(--line);background:none;color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{border-color:var(--red);color:var(--red);background:none}
.btn-block{width:100%}

/* hero */
.hero{background:var(--hero);color:#fff;padding:4rem 0 5rem}
.hero-inner{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:center}
.hero-inner>*{min-width:0}
.hero h1{font-size:clamp(2.1rem,5vw,3.5rem);font-weight:800}
.tagline{font-family:var(--font-head);font-size:1.35rem;color:var(--amber);font-weight:600;margin-bottom:.6rem}
.sub{font-size:1.15rem;opacity:.9}
.hero-buttons{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.6rem}
.preview{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:1.5rem;box-shadow:0 18px 40px rgba(0,0,0,.25);transform:rotate(1.5deg)}
.preview h2{font-size:1.1rem;margin-bottom:1rem}
.pinned{margin:1.2rem 0 0;font-size:.95rem;color:var(--muted)}

/* bars */
.bars li+li{margin-top:1rem}
.bar-label{display:flex;justify-content:space-between;gap:1rem;font-size:.95rem;margin-bottom:.3rem}
.bar{position:relative;height:10px;background:var(--line);border-radius:99px;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar i.low{background:var(--amber)}
.bar i.bad{background:var(--red)}
.bar::after{content:"";position:absolute;left:75%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.bar-note{font-size:.82rem;color:var(--muted);margin-top:.2rem}

/* sections */
.section-title{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:1.5rem}
.features{padding:4rem 0}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem}
.feature{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem;min-width:0}
.feature h3{font-size:1.2rem}
.feature p{color:var(--muted);margin:0}
.glyph{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--indigo);font-family:var(--font-head);font-weight:800;margin-bottom:.8rem}
:root[data-theme="dark"] .glyph{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .glyph{color:var(--amber)}}
.about{padding:1rem 0 4rem}
.about-inner{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
.about-inner>*{min-width:0}
.roles li{padding:.9rem 0;border-top:1px solid var(--line)}
.roles li:last-child{border-bottom:1px solid var(--line)}
.footer{background:var(--indigo-dark);color:#cfd3ee;padding:1.4rem 0;font-size:.95rem}
.footer-inner{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* login */
.login-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;padding-block:3.5rem}
.login-wrap>*{min-width:0}
.side-list li{padding:.35rem 0;color:var(--muted)}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.6rem;box-shadow:0 12px 30px rgba(21,29,68,.12)}
.role-tabs{display:flex;gap:.4rem;background:var(--soft);padding:.3rem;border-radius:999px;margin-bottom:1.2rem}
.tab{flex:1;border:0;background:none;border-radius:999px;padding:.5rem;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--indigo);color:#fff}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.95rem}
.field input,.field select,.field textarea{width:100%;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px rgba(245,184,61,.5)}
.error{color:var(--red);font-size:.88rem;margin:.25rem 0 0;min-height:1.1em}
.alert{background:rgba(201,55,63,.12);border:1px solid var(--red);color:var(--red);padding:.6rem .9rem;border-radius:10px;margin-bottom:1rem;font-size:.95rem}
.alert.ok{background:rgba(30,158,106,.12);border-color:var(--green);color:var(--green)}
.hint{background:var(--soft);border-radius:10px;padding:.7rem .9rem;font-size:.9rem;color:var(--muted);margin-top:1rem}
.hint code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.hint button{margin-top:.5rem}

/* password eye */
.pw{position:relative}.pw input{padding-right:4.6rem}
.eye{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);border:0;background:var(--soft);color:var(--ink);border-radius:8px;padding:.3rem .65rem;font-size:.82rem;font-weight:700;cursor:pointer}
/* app */
.app{padding-block:1.6rem 3rem}
.app-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.app-head h1{font-size:clamp(1.5rem,3vw,2rem);margin:0}
.app-head p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:.3rem;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.tabs button{border:0;background:none;padding:.7rem 1rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.badge{display:inline-block;background:var(--amber);color:var(--on-amber);border-radius:99px;font-size:.78rem;font-weight:700;padding:0 .5rem;margin-left:.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem}
.grid>*{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;min-width:0}
.panel h2{font-size:1.15rem}
.panel+.panel{margin-top:1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.2rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.2rem}
.stat b{display:block;font-family:var(--font-head);font-size:2rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.list li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{min-width:0}
.list .t strong{display:block}
.list .t small{color:var(--muted)}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:.1rem .6rem;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.exam{background:rgba(201,55,63,.15);color:var(--red)}
.pill.event{background:rgba(30,158,106,.15);color:var(--green)}
.pill.holiday{background:rgba(245,184,61,.25)}
.toolbar{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input,.toolbar select{padding:.55rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);min-width:0;flex:1 1 180px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.97rem}
th,td{text-align:left;padding:.65rem .6rem;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
td.num{font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:.6rem}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--green)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--indigo-dark);color:#fff;padding:.7rem 1.2rem;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;max-width:calc(100% - 2rem);text-align:center}
.empty{color:var(--muted);padding:1rem 0;margin:0}
.demo-note{background:var(--soft);color:var(--muted);font-size:.88rem;padding:.5rem 0;text-align:center}

@media (max-width:760px){
  .hero-inner,.about-inner,.login-wrap{grid-template-columns:1fr;gap:2rem}
  .preview{transform:none}
  .hero{padding:2.5rem 0 3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  /* ---------- accounts: only the admin is built in. Everything else is created by users and saved in this browser (localStorage). ---------- */
  /* Passwords are stored as SHA-256 hashes, never as plain text. */
  var ACCOUNTS=[
    {role:'admin',ids:['akvadmin@gmail.com'],hash:'739b623e71eac91acdf0979b3b6db6e4fd2c6ed9a6403f410d123a336305014c',name:'Administrator',code:'akvadmin@gmail.com',dept:'All departments'}
  ];
  function sha(pw){var b=new TextEncoder().encode('cc|'+pw);return crypto.subtle.digest('SHA-256',b).then(function(d){return [].map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
  function loadReg(){try{return JSON.parse(localStorage.getItem('cc_users')||'[]')}catch(e){return []}}
  function saveReg(a){try{localStorage.setItem('cc_users',JSON.stringify(a))}catch(e){}}
  function loadLog(){try{return JSON.parse(localStorage.getItem('cc_log')||'[]')}catch(e){return []}}
  function saveLog(a){try{localStorage.setItem('cc_log',JSON.stringify(a.slice(0,200)))}catch(e){}}
  function kv(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
  function setkv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  /* ---------- file storage (IndexedDB, so large PDF/DOC/PPT files fit) ---------- */
  var MAX_FILE=20*1024*1024;
  var FILE_EXT={pdf:'PDF',doc:'DOC',docx:'DOC',ppt:'PPT',pptx:'PPT'};
  function fileExt(n){var m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():''}
  function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
  function idb(){return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('nodb'));return}
    var r=indexedDB.open('cc_files',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('files')};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  })}
  function idbPut(k,blob){return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,k);
    tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)};
  })})}
  function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){
    var q=db.transaction('files','readonly').objectStore('files').get(k);
    q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};
  })})}
  function attFor(code){var r=kv('cc_att',{}),o={};SUBJECTS.forEach(function(s){var p=0,t=0,days=r[s]||{};Object.keys(days).forEach(function(d){if(code in days[d]){t++;if(days[d][code])p++}});o[s]=[p,t]});return o}
  function unread(){if(!S.user)return 0;var seen=kv('cc_seen_'+S.user.code,0);return D.notices.concat(D.materials,D.events).filter(function(x){return x.id>seen}).length}
  function fmtDT(s){var d=new Date(s);if(isNaN(d))return '-';return d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}
  var SUBJECTS=['Python','DBMS','Web Technology','Data Structures'];

  function pct(a){return a[1]?Math.round(a[0]/a[1]*1000)/10:0}
  function cls(p){return p>=75?'':(p>=65?'low':'bad')}
  function fmtDate(s){var d=new Date(s.replace(' ','T'));if(isNaN(d))return s;return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
  function bar(label,a){
    if(!a[1])return '<li><div class="bar-label"><span>'+esc(label)+'</span><strong>No classes yet</strong></div><div class="bar"><i style="width:0"></i></div></li>';
    var p=pct(a),short=p<75?Math.max(0,Math.ceil((0.75*a[1]-a[0])/0.25)):0;
    return '<li><div class="bar-label"><span>'+esc(label)+'</span><strong>'+p+'%</strong></div><div class="bar"><i class="'+cls(p)+'" style="width:'+Math.min(p,100)+'%"></i></div>'+
      '<div class="bar-note">'+a[0]+' of '+a[1]+' classes'+(short?'. Attend the next '+short+' in a row to reach 75%.':'')+'</div></li>';
  }

  /* ---------- render ---------- */
  function downloadMat(id,btn){
    var m=D.materials.filter(function(x){return String(x.id)===String(id)})[0];
    if(!m||!m.fileId){toast('No file attached');return}
    var fname=m.fileName||m.title;
    idbGet(m.fileId).then(function(blob){
      if(!blob){toast('File not found in this browser');return}
      if(window.claude&&typeof window.claude.use==='function'){
        return window.claude.use('downloads').then(function(dl){
          if(!dl){toast('Downloads are not available in this view');return}
          return dl.save({filename:fname,data:blob}).then(function(){toast('Download started')});
        });
      }
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=fname;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
    }).catch(function(err){
      var c=err&&err.code;
      if(c==='declined')return;
      if(c==='rejected_extension'||c==='extension_not_enabled')toast('This file type (.'+fileExt(fname)+') cannot be downloaded here. Upload PDF, DOCX or PPTX.');
      else toast('Could not download the file');
    });
  }
  function render(keepFocus){
    renderNav();

    if(S.view==='home')v.innerHTML=home();
    else if(S.view==='login')v.innerHTML=login();

    else v.innerHTML=shell(PAGES[S.user.role][S.tab]());
  }
  function go(view){
    S.view=view;S.loginErr='';
    if(view==='about'){S.view='home';render();var a=$('#about');if(a)a.scrollIntoView();return}
    if(view==='home'&&S.user){S.view='app'}
    render();window.scrollTo(0,0);
  }

    if(d.dl){downloadMat(d.dl,t)}
    else if(d.eye){var pi=document.getElementById(d.eye),sh=pi.type==='password';pi.type=sh?'text':'password';t.textContent=sh?'Hide':'Show'}
    else if(d.newreg){S.regRole=d.newreg;S.loginErr='';S.view='register';render();window.scrollTo(0,0)}
    else if(d.go){if(d.go==='register')S.regRole='student';go(d.go)}
    else if(d.login){S.role=d.login;S.loginMsg='';S.view='login';render();window.scrollTo(0,0)}
    else if(d.role){S.role=d.role;S.loginErr='';render()}
    else if(d.tab){S.tab=d.tab;S.q='';S.subj='';S.cat='';render();if(S.user.role==='student'&&d.tab==='not'&&unread()){setkv('cc_seen_'+S.user.code,Date.now());setTimeout(render,0)}}
    else if(d.evtab){S.evTab=d.evtab;render()}
    else if(d.reg){var all=kv('cc_ev',[]),ev=all.filter(function(x){return x.id==d.reg})[0];if(!ev)return;ev.regs=ev.regs||[];var ix=ev.regs.indexOf(S.user.code);if(ix>-1)ev.regs.splice(ix,1);else ev.regs.push(S.user.code);setkv('cc_ev',all);render();toast(ix>-1?'Registration cancelled':'Registered for '+ev.title)}
    else if(d.act==='logout'){S.user=null;S.view='login';S.role='student';S.fd=undefined;S.ms='';S.md='';S.lid='';S.loginMsg='You have been logged out.';S.tempPw='';render();window.scrollTo(0,0)}
    else if(d.act==='theme'){
      var root=document.documentElement,dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme',dark?'light':'dark');
    }
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='mf'){var fl=e.target.files[0];if(fl){var ty=FILE_EXT[fileExt(fl.name)];if(ty)$('#mty').value=ty;else{toast('Only PDF, DOC and PPT files are allowed');e.target.value=''}}}
    if(e.target.id==='subj'){S.subj=e.target.value;render()}
    if(e.target.id==='cat'){S.cat=e.target.value;render()}
    if(e.target.id==='fdept'){S.fd=e.target.value;render()}
    if(e.target.id==='msub'){S.ms=e.target.value;render()}
    if(e.target.id==='mdate'){S.md=e.target.value;render()}
  });

  var fails={};
  function field(id,msg){var el=$('#'+id);if(el){el.textContent=msg||''}return !msg}
  function doLogin(){
    var id=$('#userId').value.trim().toLowerCase(),pw=$('#password').value,ok=true;
    $('#e1').textContent='';$('#e2').textContent='';
    if(id.length<3){$('#e1').textContent='Enter your register number or email.';ok=false}
    if(!pw){$('#e2').textContent='Enter your password.';ok=false}
    if(!ok)return;
    var key=S.role+':'+id;S.lid=id;
    if((fails[key]||0)>=5){S.loginErr='Too many wrong attempts. Try again in 15 minutes.';S.loginMsg='';render();return}
    sha(pw).then(function(hash){
      var all=ACCOUNTS.concat(loadReg().map(function(u){return {role:u.role==='faculty'?'faculty':'student',ids:[u.code.toLowerCase(),u.email.toLowerCase()],hash:u.hash,name:u.name,code:u.code,dept:u.dept,year:u.year}}));
      var m=all.filter(function(a){return a.role===S.role&&a.ids.indexOf(id)>-1&&a.hash===hash})[0];
      if(m){
        fails[key]=0;
        if(m.role!=='admin'){
          var now=new Date().toISOString(),rg=loadReg();
          rg.forEach(function(u){if(u.code===m.code&&(u.role==='faculty'?'faculty':'student')===m.role){u.lastLogin=now;u.logins=(u.logins||0)+1}});
          saveReg(rg);
          var lg=loadLog();lg.unshift({time:now,code:m.code,name:m.name,role:m.role[0].toUpperCase()+m.role.slice(1)});saveLog(lg);
        }
        S.lid='';
        S.user={role:m.role,name:m.name,code:m.code,dept:m.dept,year:m.year};
        S.tab=TABS[m.role][0][0];S.view='app';S.loginMsg='';S.loginErr='';S.q='';render();window.scrollTo(0,0);
      }else{
        fails[key]=(fails[key]||0)+1;S.loginErr='Wrong ID or password.'+(fails[key]>=3?' '+(5-fails[key])+' tries left before this ID is locked.':'');S.loginMsg='';render();
      }
    });
  }
  function doRegister(){
    var fac=S.regRole==='faculty',n=$('#rn').value.trim(),c=$('#rc').value.trim().toUpperCase(),em=$('#re').value.trim().toLowerCase(),p1=$('#rp').value,p2=$('#rp2').value;
    var ok=true;
    ok=field('e_rn',n.length<3?'Enter your full name.':'')&&ok;
    ok=field('e_rc',!/^[A-Z0-9]{5,15}$/.test(c)?(fac?'Faculty ID: ':'')+'use letters and digits only, 5 to 15 characters.':'')&&ok;
    ok=field('e_re',!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)?'Enter a valid email address.':'')&&ok;
    ok=field('e_rp',p1.length<8?'Password must be at least 8 characters.':'')&&ok;
    ok=field('e_rp2',p1!==p2?'Passwords do not match.':'')&&ok;
    if(!ok)return;
    var reg=loadReg();
    var taken=reg.some(function(u){return u.code===c||u.email===em})||ACCOUNTS.some(function(a){return a.ids.indexOf(c.toLowerCase())>-1||a.ids.indexOf(em)>-1});
    if(taken){S.loginErr='That '+(fac?'faculty ID':'register number')+' or email is already registered.';render();return}
    sha(p1).then(function(hash){
      var u={role:fac?'faculty':'student',code:c,email:em,name:n,dept:$('#rd').value,hash:hash,created:new Date().toISOString(),lastLogin:null,logins:0};
      if(!fac)u.year=+$('#ry').value;
      reg.push(u);saveReg(reg);
      S.role=fac?'faculty':'student';S.view='login';S.loginErr='';S.loginMsg='Account created. Log in with your '+(fac?'faculty ID':'register number')+' or email and your password.';render();window.scrollTo(0,0);
    });
  }
  document.addEventListener('submit',function(e){
    e.preventDefault();var f=e.target.id,u=S.user;
    if(f==='loginForm'){doLogin();return}
    if(f==='regForm'){doRegister();return}
    if(0){}
    else if(f==='markForm'){
      var sub=$('#msub').value,dt=$('#mdate').value,boxes=document.querySelectorAll('.pres');if(!dt||!boxes.length)return;
      var all=kv('cc_att',{}),day={},pc=0;all[sub]=all[sub]||{};
      [].forEach.call(boxes,function(b){day[b.dataset.code]=b.checked?1:0;if(b.checked)pc++});
      all[sub][dt]=Object.assign(all[sub][dt]||{},day);setkv('cc_att',all);
      toast('Saved '+sub+': '+pc+' present, '+(boxes.length-pc)+' absent');
    }
    else if(f==='matForm'){
      var t=$('#mt').value.trim();if(!t)return;
      var fi=$('#mf'),file=fi&&fi.files[0];
      if(!file){toast('Please attach a file');return}
      var ftype=FILE_EXT[fileExt(file.name)];
      if(!ftype){toast('Only PDF, DOC and PPT files are allowed');return}
      if(file.size>MAX_FILE){toast('File is too large (max 20 MB)');return}
      if(file.size===0){toast('That file is empty');return}
      var mid=Date.now(),subj=$('#ms').value,fid='f'+mid+'_'+Math.random().toString(36).slice(2,8);
      var sb=e.target.querySelector('button[type=submit]');if(sb){sb.disabled=true;sb.textContent='Uploading...'}
      idbPut(fid,file).then(function(){
        var ml=D.materials;ml.unshift({id:mid,title:t,subject:subj,type:ftype,by:u.name,date:new Date().toISOString().slice(0,10),fileId:fid,fileName:file.name,size:file.size,mime:file.type});
        if(!setkv('cc_mat',ml))throw new Error('meta');
        render();toast('Material uploaded');
      }).catch(function(){
        if(sb){sb.disabled=false;sb.textContent='Upload'}
        toast('Upload failed. Browser storage may be full or blocked.');
      });
    }
    else if(f==='evForm'){
      var el=D.events;el.push({id:Date.now(),title:$('#et').value.trim(),cat:$('#ec').value,date:$('#ed').value,venue:$('#ev').value.trim(),regs:[]});
      setkv('cc_ev',el);render();toast('Event created');
    }
    else if(f==='notForm'){
      var nt=$('#nt').value.trim();if(!nt)return;
      var nl=D.notices;nl.unshift({id:Date.now(),title:nt,cat:$('#nc').value,date:new Date().toISOString().slice(0,10),by:u.name});
      setkv('cc_not',nl);render();toast('Notice posted. Students will see it.');
    }
    else if(f==='usrForm'){
      var un=$('#un').value.trim(),uc=$('#uc').value.trim().toUpperCase(),um=$('#um').value.trim().toLowerCase();
      if(un.length<3||!/^[A-Z0-9]{5,15}$/.test(uc)||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(um)){toast('Enter a name, a valid register number and an email.');return}
      var rg=loadReg();
      if(rg.some(function(x){return x.code===uc||x.email===um})||ACCOUNTS.some(function(a){return a.ids.indexOf(uc.toLowerCase())>-1||a.ids.indexOf(um)>-1})){toast('That register number or email is already registered.');return}
      var rb=new Uint32Array(2);crypto.getRandomValues(rb);var tp='CC-'+(rb[0].toString(36)+rb[1].toString(36)).slice(0,6).toUpperCase();
      sha(tp).then(function(h){rg.push({role:'student',code:uc,email:um,name:un,dept:$('#ud').value,year:+$('#uy').value,hash:h,created:new Date().toISOString(),lastLogin:null,logins:0});saveReg(rg);S.tempPw=tp;render();toast('Student created')});
    }
  });

  render();
})();
</script>

</body></html>
